name: shiroterm
services:
  server:
    image: ${SHIROTERM_IMAGE:-ghcr.io/richailo/shiroterm-server:0.1.0}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      PUBLIC_URL: ${PUBLIC_URL:?Run node setup.cjs your-domain first}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
      DEVICE_SESSION_DAYS: ${DEVICE_SESSION_DAYS:-30}
      HISTORY_LIMIT: ${HISTORY_LIMIT:-100}
      VAULTWARDEN_URL: ${VAULTWARDEN_URL:-}
      VAULT_UNLOCK_MINUTES: ${VAULT_UNLOCK_MINUTES:-60}
    secrets: [admin_password]
    volumes:
      - server_data:/data
    networks: [backend]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      SHIROTERM_DOMAIN: ${SHIROTERM_DOMAIN:?Set the server domain in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
secrets:
  admin_password:
    file: ./secrets/admin_password
volumes:
  server_data:
  caddy_data:
  caddy_config:
networks:
  backend:
