name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Test real Electron SSH and SFTP on Windows
        if: runner.os == 'Windows'
        run: npm run test:native
      - name: Test real Electron SSH and SFTP on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:native
      - run: npm run package
      - name: Test packaged application on Windows
        if: runner.os == 'Windows'
        run: npm run test:packaged
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:packaged
      - name: Test HTTPS certificate import on Windows
        if: runner.os == 'Windows'
        run: npm run test:sync-tls -- --packaged
      - name: Test HTTPS certificate import on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:sync-tls -- --packaged
      - run: npm run archive
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShiroTerm-${{ runner.os }}
          path: |
            release/*.zip
            release/*.tar.gz
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: ShiroTerm-*
          path: release
          merge-multiple: true
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" *.zip *.tar.gz SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "ShiroTerm $RELEASE_TAG" --notes-file ../RELEASE_NOTES.md --verify-tag
